name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.22 is the declared floor in go.mod.
        go: ["1.22", "1.23", "stable"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Test
        run: go test -race ./...

  quality:
    name: Vet and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: go vet
        run: go vet ./...

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      # go.mod has no requires, so tidy must leave it untouched.
      #
      # Checked with `git status` rather than `git diff`: this module has no
      # dependencies and therefore no go.sum, and `git diff -- go.sum` fails
      # with "no such path" on a file that does not exist. Using status also
      # catches a go.sum that tidy newly creates, which a diff of tracked paths
      # would miss entirely.
      - name: go mod tidy is a no-op
        run: |
          go mod tidy
          CHANGED=$(git status --porcelain -- go.mod go.sum)
          if [ -n "$CHANGED" ]; then
            echo "::error::go mod tidy changed the module files; commit the result"
            echo "$CHANGED"
            git diff -- go.mod
            exit 1
          fi
          echo "go.mod is tidy, and no go.sum is needed"

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go test -coverprofile=coverage.out ./...
      - run: go tool cover -func=coverage.out | tail -1
